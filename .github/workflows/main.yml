name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Auto-detect Project Directory & Install Dependencies
        id: setup_project
        run: |
          if [ -f "package.json" ]; then
            PROJECT_DIR="."
          elif [ -f "my-website/package.json" ]; then
            PROJECT_DIR="my-website"
          else
            # Search for package.json in first level subdirectories
            PROJECT_DIR=$(find . -maxdepth 2 -name "package.json" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
          fi
          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          
          cd "$PROJECT_DIR"
          if [ -f "package-lock.json" ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Production Site
        run: |
          PROJECT_DIR="${{ steps.setup_project.outputs.project_dir }}"
          cd "$PROJECT_DIR"
          export EXPORT_STATIC="true"
          export GITHUB_PAGES="true"
          export BASE_PATH="${{ steps.pages.outputs.base_path }}"
          npm run build

      - name: Prepare Static Artifacts
        id: prepare_artifact
        run: |
          PROJECT_DIR="${{ steps.setup_project.outputs.project_dir }}"
          cd "$PROJECT_DIR"
          
          # Detect output directory (out for Next.js static export, dist for Vite)
          if [ -d "out" ]; then
            OUTPUT_DIR="$PROJECT_DIR/out"
          elif [ -d "dist" ]; then
            OUTPUT_DIR="$PROJECT_DIR/dist"
          else
            OUTPUT_DIR="$PROJECT_DIR"
          fi
          
          # Ensure .nojekyll exists so GitHub Pages serves directories prefixed with _ (e.g. _next)
          touch "$OUTPUT_DIR/.nojekyll"
          
          # Ensure 404.html fallback is present in output
          if [ -f "public/404.html" ] && [ ! -f "$OUTPUT_DIR/404.html" ]; then
            cp "public/404.html" "$OUTPUT_DIR/404.html"
          fi
          
          echo "Output directory: $OUTPUT_DIR"
          echo "artifact_path=$OUTPUT_DIR" >> $GITHUB_OUTPUT

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.prepare_artifact.outputs.artifact_path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
